<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:description" content="An extention of the Rainy Getaway program that allows you to add any city in the world and get accurate weather information">
    <meta property="og:image" content="https://mayathemonster.github.io/wdd231/Final_Project/images/favicon.ico">
    <meta property="og:title" content="Homepage - Chamber of Comerce Foz do Iguaçu">

    <title>Rainy Getaway</title>
</head>
<body>
    <header>
        <div>
            <img src="images/cloud-drizzle.svg" alt="🌧" class="title rightSide">
            <p class="title">Rainy Getaway</p>
            <img src="images/cloud-sun.svg" alt="🌥" class="title">
            <button id="nav-button" class="navButton" aria-label="navigation"></button>
            <p class="titleCenter">A place to help you Get-Away from bad weather!</p>
        </div>
        <nav class="navygate titleCenter"><ul>
            <li class="radial"><a href="index.html">Welcome Page</a></li>
            <li><a href="getaway_page.html" class="current">Rainy Getaway</a></li>
            <li class="radial2"><a href="form_page.html">Add your own city</a></li>
        </ul></nav>
    </header>
    <main>
        <h1 class="block smallifyTitle">Get-Away!</h1>
        <div class="weathers">
            <a href="#" id="rainFilter" class="filter">Rainy</a>
            <a href="#" id="cloudFilter" class="filter">Cloudy</a>
            <a href="#" id="sunFilter" class="filter">Sunny</a>
        </div>
        <div id="filterWeather"></div>
        <dialog id="modal" class="popup block">
            <h2 id="city"></h2>
            <p id="country"></p>
            <p id="continent"></p>
            <div id="displayFull">
                
            </div>
            <button id="closeMod">Close</button>
        </dialog>
    </main>
    <footer>
        <a href="https://www.linkedin.com/"><img src="../images/linkedin.svg" alt="LinkedIn" width="50" height="50"></a>

        <a href="https://discord.com/"><img src="../images/discord.svg" alt="Discord" width="50" height="50"></a>
        <div class="block">
            <p><span id="currentyear"></span> - Igor Duarte Barros - Brazil</p>
            <p id="lastModified"></p>
